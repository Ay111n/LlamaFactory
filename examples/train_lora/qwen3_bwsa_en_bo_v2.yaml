### 模型与路径
model_name_or_path: /home/nlp/data/lyl/model/qwen3-8bbo-sft-new2

### 训练方法
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

### 数据集
dataset: bwsa_en_bo_dataset
template: qwen
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16

### 自定义 BWSA 参数
use_bwsa_loss: true        # 开启我们自定义的 BWSA 损失函数
bwsa_alpha: 0.1            # 语义一致性损失权重 lambda

### 输出
output_dir: /home/nlp/data/lyl/lora_adapter/qwen3-8b/bwsa_en_bo_v2
logging_steps: 5
save_steps: 500
save_total_limit: 2
save_only_model: true
plot_loss: true
overwrite_output_dir: true

### 训练超参数
per_device_train_batch_size: 2 
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 100
bf16: true                        # L20 架构必须开启 bf16
gradient_checkpointing: true      # 显存优化核武器：用计算时间换显存空间
flash_attn: fa2                   # 显式启用 Flash Attention 2